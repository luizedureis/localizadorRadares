name: iOS IPA para Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [feat/app-radares]
    paths:
      - 'radares/**'
      - '.github/workflows/ios-ipa.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: radares
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: radares/package-lock.json

      - name: Selecionar Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26.*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar projeto iOS
        run: npx expo prebuild --platform ios

      - name: Compilar sem assinatura
        working-directory: radares/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace)
          SCHEME=${WORKSPACE%.xcworkspace}
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log | grep -E "error:|\*\* BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Empacotar IPA
        working-directory: radares/ios
        run: |
          APP="build/Build/Products/Release-iphoneos/$SCHEME.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # Ad-hoc signature only carries the entitlements; Sideloadly re-signs everything.
          for EXT in "Payload/$SCHEME.app"/PlugIns/*.appex; do
            NAME=$(basename "$EXT" .appex)
            codesign --force --sign - --entitlements "$NAME/$NAME.entitlements" "$EXT"
          done
          codesign --force --sign - --entitlements "$SCHEME/$SCHEME.entitlements" "Payload/$SCHEME.app"
          /usr/bin/zip -qry Radares.ipa Payload
          ls -lh Radares.ipa
          ls "Payload/$SCHEME.app/PlugIns"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "Payload/$SCHEME.app/Info.plist"

      - uses: actions/upload-artifact@v5
        with:
          name: Radares-ipa
          path: radares/ios/Radares.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: xcodebuild-log
          path: radares/ios/xcodebuild.log
          if-no-files-found: ignore
